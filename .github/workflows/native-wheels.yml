name: native wheels

# Builds the optional native loader (zs_yaml_native) as forward-compatible
# cp311-abi3 wheels across the 5 supported platforms. One abi3 wheel per
# platform serves CPython 3.11 and every later version. rapidyaml is vendored,
# so there are no system dependencies to install.
#
# The main zs-yaml package stays pure Python (built in ci.yml); these wheels are
# an optional acceleration layer with an automatic pure-Python fallback, so they
# are uploaded as artifacts here rather than gating install.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  archs: x86_64 }
          - { os: ubuntu-latest,  archs: aarch64 }
          - { os: macos-13,       archs: x86_64 }
          - { os: macos-14,       archs: arm64 }
          - { os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4

      # aarch64 Linux wheels are built under QEMU emulation.
      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest' && matrix.archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: native
        env:
          # abi3: build once on 3.11, the wheel is forward-compatible.
          CIBW_BUILD: cp311-*
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_TEST_COMMAND: python -P "{package}/smoketest.py"

      - uses: actions/upload-artifact@v4
        with:
          name: zs-yaml-native-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  # Forward-compatibility gate: install the cp311-abi3 wheel on a NEWER Python
  # (3.13) and run the smoke test, actively re-proving that one abi3 build
  # serves later interpreters instead of only trusting the stable-ABI guarantee.
  # Covers the natively-run arch of each OS (the abi3/Python-version axis is
  # arch-independent).
  forward-compat:
    name: abi3 on py3.13 ${{ matrix.os }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  archs: x86_64 }
          - { os: macos-13,       archs: x86_64 }
          - { os: macos-14,       archs: arm64 }
          - { os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: zs-yaml-native-${{ matrix.os }}-${{ matrix.archs }}
          path: dist
      - name: Install cp311-abi3 wheel on Python 3.13 and smoke-test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -P native/smoketest.py
